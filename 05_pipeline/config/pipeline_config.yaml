versions:
  prompt_version: "1.0"
  criterion_catalog_version: "1.0"
  applicability_matrix_version: "1.0"

vignettes:
  included_ids: ["V01", "V02", "V03", "V04"]

models:
  model_1:
    provider: "academic_cloud"
    model_id: "dein-modell-name-in-der-cloud" # z.B. gpt-4o oder llama3
    access_mode: "api"
    parameters:
      temperature: 0.0
      seed: 42
      max_tokens: 1500

prompts:
  system_prompt: ""
  user_prompt_template: "{vignette_text}"

execution:
  runs_per_model: 1
  retry_rule: "Max 3 Retries"